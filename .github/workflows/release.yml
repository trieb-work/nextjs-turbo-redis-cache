name: Release

on:
  push:
    branches:
      - main
      - beta

# semantic-release: git tag + GitHub Release + npm publish (OIDC via @semantic-release/npm)
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: corepack enable

      # Node 22 ships npm 10.x; OIDC trusted publishing needs npm >=11.5.1 at publish time.
      # Keep CI on 22; only the release job needs the newer runtime for @semantic-release/npm.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Build project
        run: pnpm build

      - name: Verify working tree is clean before release
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty before semantic-release. Aborting."
            git status --short
            git diff --stat
            exit 1
          fi

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
